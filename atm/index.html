<!DOCTYPE html>
<html>
<head>
  <title>ATM PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="atm">

  <!-- LOGO -->
  <img src="img/logo.png" class="logo">

  <h2>Bienvenido</h2>

  <input type="text" id="tarjeta" placeholder="Numero de tarjeta">
  <input type="password" id="pin" placeholder="PIN" maxlength="4">

  <div class="teclado">

    <!-- FILA 1 -->
    <button class="n7" onmousedown="return false" onclick="presionar('7')">7</button>
    <button class="n8" onmousedown="return false" onclick="presionar('8')">8</button>
    <button class="n9" onmousedown="return false" onclick="presionar('9')">9</button>
    <button class="cambiar" onmousedown="return false" onclick="cambiarCampo()">CAMBIAR</button>

    <!-- FILA 2 -->
    <button class="n4" onmousedown="return false" onclick="presionar('4')">4</button>
    <button class="n5" onmousedown="return false" onclick="presionar('5')">5</button>
    <button class="n6" onmousedown="return false" onclick="presionar('6')">6</button>
    <button class="enter" onmousedown="return false" onclick="login()">ENTER</button>

    <!-- FILA 3 -->
    <button class="n1" onmousedown="return false" onclick="presionar('1')">1</button>
    <button class="n2" onmousedown="return false" onclick="presionar('2')">2</button>
    <button class="n3" onmousedown="return false" onclick="presionar('3')">3</button>

    <!-- FILA 4 -->
    <button class="cero" onmousedown="return false" onclick="presionar('0')">0</button>
    <button class="del" onmousedown="return false" onclick="borrar()">DEL</button>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
